<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FlowLens AI turns everyday workplace friction into clear, actionable insight — track what's slowing you down and let AI show you how to fix it." />
    <meta name="theme-color" content="#F8F7F3" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <title>FlowLens AI — Turn friction into flow</title>

    <script>
      // Runs before React mounts to avoid a flash of the wrong theme —
      // ThemeProvider (src/context/theme-context.tsx) re-applies this on
      // mount too, this is purely to prevent the visible flash on load.
      (function () {
        try {
          var stored = localStorage.getItem('flowlens_theme');
          var isDark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
